name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pytest jsonschema
      - run: python -m pytest -q
      - run: python research/sway/implementation/exact_threshold.py
      - run: python research/sway/implementation/noise.py
      - run: python tools/substrate_mutants.py
