name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}  # SUB-1 P6 reads src/eunoia/__init__.py at bf437b0
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pytest jsonschema
      - run: python -m pytest -q
      - run: python research/sway/implementation/exact_threshold.py
      - run: python research/sway/implementation/noise.py
      - name: SUB-1 harness reproduces the recorded verdict and digest
        run: python tools/sub1_run.py
      - name: SUB-1 sabotage (gate replaced by the rival) must exit 1
        run: |
          if python tools/sub1_run.py --sabotage; then echo "sabotage exited 0"; exit 1; fi
